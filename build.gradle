plugins {
    id "java"
    alias(libs.plugins.shadow)
}

import java.time.LocalDateTime
import java.time.format.DateTimeFormatter

group = "org.airmap"
version = libs.versions.plugin.get()

layout.buildDirectory.set(file("target"))

def javaTarget = libs.versions.javaTarget.get().toInteger()
def pluginVersion = libs.versions.plugin.get()
def buildTimestamp = LocalDateTime.now().format(DateTimeFormatter.ofPattern("yyMMdd-HHmm"))

base {
    archivesName = "AirMap-WorldGuard"
}

def timestampedJarName = "${base.archivesName.get()}-${pluginVersion}-${buildTimestamp}.jar"

dependencies {
    compileOnly(libs.dynmap.api) {
        exclude group: "org.bukkit"
        exclude group: "org.spigotmc"
    }
    compileOnly(libs.dynmap.core.api) {
        exclude group: "org.bukkit"
        exclude group: "org.spigotmc"
    }
    compileOnly libs.spigot.api
    compileOnly(libs.worldedit.bukkit) {
        exclude group: "org.bukkit"
        exclude group: "org.spigotmc"
    }
    compileOnly(libs.worldguard.bukkit) {
        exclude group: "org.bukkit"
        exclude group: "org.spigotmc"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = javaTarget
}

processResources {
    inputs.property("version", pluginVersion)
    filesMatching(["plugin.yml", "paper-plugin.yml", "*.txt"]) {
        expand([version: pluginVersion, project: [version: pluginVersion]])
    }
}

shadowJar {
    archiveClassifier = ""
    archiveVersion = "${pluginVersion}-${buildTimestamp}"
}

jar {
    enabled = false
}

assemble {
    dependsOn shadowJar
}

tasks.register("packageZip", Zip) {
    dependsOn shadowJar
    archiveClassifier = "bin"
    from(tasks.named("shadowJar").flatMap { it.archiveFile }) {
        rename { timestampedJarName }
    }
}

tasks.register("printJavaCompatibility") {
    def runtimeJava = JavaVersion.current()
    def targetJava = javaTarget
    doLast {
        println "Gradle runtime Java: ${runtimeJava}"
        println "Compiled bytecode target: Java ${targetJava}"
    }
}
